apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  labels:
    app: app2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: traefik/whoami
          args:
            - "--port=2001"
            - "--name=iaminception"
          ports:
            - containerPort: 2001
