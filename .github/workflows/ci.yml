name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck all scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: '.git'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML manifests
        run: |
          files=$(find . -type f \( -name '*.yaml' -o -name '*.yml' \) -not -path './.git/*')
          if [ -z "$files" ]; then
            echo "No YAML files to lint yet"
            exit 0
          fi
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable}}" $files

      - name: Install Vagrant
        run: |
          wget -O - https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update -y
          sudo apt-get install -y vagrant virtualbox

      - name: Validate Vagrantfiles
        run: |
          found=0
          for f in p1/Vagrantfile p2/Vagrantfile bonus/Vagrantfile; do
            if [ -f "$f" ]; then
              found=1
              echo "Validating $f"
              (cd "$(dirname "$f")" && vagrant validate)
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No Vagrantfile to validate yet"
          fi

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: |
          files=$(find p1/confs p2/confs p3/confs bonus/confs -type f \( -name '*.yaml' -o -name '*.yml' \) 2>/dev/null)
          if [ -z "$files" ]; then
            echo "No Kubernetes manifests to validate yet"
            exit 0
          fi
          kubeconform -strict -summary $files
